{% extends "base.html" %}
{% block body %}
<div class="d-flex">
  <aside class="sidebar d-flex flex-column">
    <a class="brand" href="{% url 'core:dashboard' %}">LMS</a>
    <p class="text-secondary small px-4 mb-2">Employee</p>
    <nav class="nav flex-column">
      <a class="nav-link {% if nav_active == 'dashboard' %}active{% endif %}" href="{% url 'core:dashboard' %}">Dashboard</a>
      <a class="nav-link {% if nav_active == 'my_courses' %}active{% endif %}" href="{% url 'courses:my_list' %}">My courses</a>
      <a class="nav-link {% if nav_active == 'history' %}active{% endif %}" href="{% url 'courses:history' %}">History</a>
    </nav>
  </aside>
  <div class="flex-grow-1 app-main">
    <div class="app-topbar d-flex justify-content-between align-items-center px-4 py-3">
      <h5 class="mb-0">{% block page_title %}Dashboard{% endblock %}</h5>
      <div class="d-flex align-items-center gap-3">
        <span class="text-muted small">{{ user.get_full_name|default:user.email }}</span>
        <form method="post" action="{% url 'accounts:logout' %}">
          {% csrf_token %}
          <button class="btn btn-sm btn-outline-secondary" type="submit">Logout</button>
        </form>
      </div>
    </div>
    <div class="p-4">
      {% include "includes/messages.html" %}
      {% block content %}{% endblock %}
    </div>
  </div>
</div>
{% endblock %}
