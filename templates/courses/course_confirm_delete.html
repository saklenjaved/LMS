{% extends "layouts/admin.html" %}
{% block title %}Delete course{% endblock %}
{% block page_title %}Delete course{% endblock %}
{% block content %}
<div class="danger-panel">
  <h5>Delete {{ object.title }}?</h5>
  <p class="text-muted">This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Delete</button>
    <a class="btn btn-link" href="{% url 'courses:list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
