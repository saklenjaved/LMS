<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Certificate</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .cert {
      border: 8px double #333;
      padding: 3rem;
      text-align: center;
      background: #fff;
      max-width: 800px;
      margin: 2rem auto;
    }
    @media print { .no-print { display: none; } }
  </style>
</head>
<body class="bg-light">
  <div class="text-center no-print mt-3">
    <button class="btn btn-primary" onclick="window.print()">Print</button>
    <a class="btn btn-link" href="{% url 'courses:my_detail' enrollment.pk %}">Back</a>
  </div>
  <div class="cert">
    <p class="text-uppercase text-muted">Certificate of completion</p>
    <h1 class="mb-4">LMS</h1>
    <p>This certifies that</p>
    <h2>{{ enrollment.employee.get_full_name|default:enrollment.employee.email }}</h2>
    <p>has successfully completed the course</p>
    <h3>{{ enrollment.course.title }}</h3>
    <p class="mt-4">Date: {{ enrollment.quiz_taken_at|date:"F j, Y" }}</p>
  </div>
</body>
</html>
