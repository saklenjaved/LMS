{% extends "layouts/employee.html" %}
{% block title %}New conversation{% endblock %}
{% block page_title %}New conversation{% endblock %}
{% block content %}
<div class="form-panel">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Start conversation</button>
    <a class="btn btn-link" href="{% url 'communication:list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
