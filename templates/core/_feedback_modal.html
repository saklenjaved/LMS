{% load static %}
<div class="modal fade" id="feedbackModal" tabindex="-1" aria-labelledby="feedbackModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form method="post" action="{% url 'core:feedback' %}">
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title" id="feedbackModalLabel">Send Feedback</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="fw-semibold mb-2">Category</p>
          <div class="feedback-category row g-2 mb-3">
            <div class="col-6">
              <input type="radio" class="btn-check" name="category" id="fb-general" value="general" checked>
              <label class="btn feedback-cat-btn w-100" for="fb-general"><i class="bi bi-chat-dots"></i> General</label>
            </div>
            <div class="col-6">
              <input type="radio" class="btn-check" name="category" id="fb-feature" value="feature">
              <label class="btn feedback-cat-btn w-100" for="fb-feature"><i class="bi bi-star"></i> New Feature</label>
            </div>
            <div class="col-6">
              <input type="radio" class="btn-check" name="category" id="fb-bug" value="bug">
              <label class="btn feedback-cat-btn w-100" for="fb-bug"><i class="bi bi-bug"></i> Bug / Issue</label>
            </div>
            <div class="col-6">
              <input type="radio" class="btn-check" name="category" id="fb-course" value="course_content">
              <label class="btn feedback-cat-btn w-100" for="fb-course"><i class="bi bi-journal-text"></i> Course Content</label>
            </div>
          </div>

          <label class="fw-semibold mb-2" for="fb-message">Your Message</label>
          <textarea class="form-control" id="fb-message" name="message" rows="5"
            placeholder="Tell us what you like or how we can improve..." required></textarea>

          <p class="text-muted small mt-3 mb-0">Your feedback helps us build a better product.</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary"><i class="bi bi-send"></i> Submit Feedback</button>
        </div>
      </form>
    </div>
  </div>
</div>

<style>
  .feedback-cat-btn {
    border: 1px solid #d9dee3;
    background: #fff;
    color: #1f2933;
    font-weight: 500;
    padding: .7rem 1rem;
    border-radius: .6rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .4rem;
  }
  .feedback-cat-btn i { color: #16a34a; }
  .btn-check:checked + .feedback-cat-btn {
    border-color: #16a34a;
    background: #ecfdf3;
    color: #14532d;
  }
  .btn-check:focus-visible + .feedback-cat-btn {
    box-shadow: 0 0 0 .2rem rgba(22, 163, 74, .25);
  }
</style>
