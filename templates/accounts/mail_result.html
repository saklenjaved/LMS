{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="auth-shell">
<div class="container py-5 auth-container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-body text-center p-4">
          {% if ok %}
            <h3>{{ text }}</h3>
            <p class="text-muted mb-0">Returning to your email...</p>
          {% else %}
            <h3>Link did not work</h3>
            <p>{{ text }}</p>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</div>
{% if ok %}
<script>
  setTimeout(function () {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.close();
    }
  }, 2000);
</script>
{% endif %}
</body>
</html>
