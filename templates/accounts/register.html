{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block body_class %}auth-shell{% endblock %}
{% block topnav_actions %}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body p-4">
        <h3 class="text-center">Employee register</h3>
        <p class="text-center text-muted mb-3">Create your LMS account</p>
        <form method="post">
          {% csrf_token %}
          {{ form.as_p }}
          <button class="btn btn-primary w-100" type="submit">Create account</button>
        </form>
        <p class="auth-note text-center">Already registered? <a href="{% url 'accounts:login' %}">Login</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
