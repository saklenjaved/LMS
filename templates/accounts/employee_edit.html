{% extends "layouts/admin.html" %}
{% block title %}Edit employee{% endblock %}
{% block page_title %}Edit employee{% endblock %}
{% block page_sub %}Update {{ employee.display_name }}'s details.{% endblock %}
{% block content %}
<div class="form-panel">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">Save changes</button>
    <a class="btn btn-link" href="{% url 'admin_panel:employees' %}">Cancel</a>
  </form>
</div>
{% endblock %}
